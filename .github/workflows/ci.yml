# Contrôle de qualité à chaque push et pull request (docs/ARCHITECTURE.md §9).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unit
      - name: Base de test (migrations)
        run: npm run db:reset
      - name: Tests des règles serveur
        run: npm run db:test
      - name: Compilation
        run: npm run build
